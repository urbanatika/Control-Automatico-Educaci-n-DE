{% extends "base.html" %}

{% block title %}Cambiar contraseña · {{ site_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="auth-shell">
      <h1 style="font-size:1.5rem;text-align:center;">Cambiar contraseña</h1>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="form-errors">{{ field.errors|striptags }}</div>{% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Guardar</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
