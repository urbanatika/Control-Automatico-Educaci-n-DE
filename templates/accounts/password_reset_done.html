{% extends "base.html" %}

{% block title %}Revisa tu correo · {{ site_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container text-center" style="max-width:520px;">
    <h1 style="font-size:1.6rem;">Revisa tu correo</h1>
    <p style="color:var(--text-muted);">Si existe una cuenta con ese correo, te enviamos un enlace para restablecer tu contraseña.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline">Volver a iniciar sesión</a>
  </div>
</section>
{% endblock %}
