<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Foto de perfil de reemplazo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d5c"/>
      <stop offset="100%" stop-color="#0a1a2b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <circle cx="240" cy="240" r="150" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="10 8" opacity="0.6"/>
  <text x="240" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="140" font-weight="700" fill="#e6edf3" text-anchor="middle">DE</text>
  <text x="240" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7fa8c9" text-anchor="middle">Reemplaza esta imagen en static/images/profile.jpg</text>
